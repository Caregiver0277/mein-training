# Baut bei jedem Push auf main die Debug-APK und legt sie in das Release „latest“.
# Handy-Link: https://github.com/Caregiver0277/mein-training/releases/latest/download/mein-training.apk
# Signiert mit dem Debug-Schlüssel des PCs (Secret DEBUG_KEYSTORE_B64), damit sich die
# App über die installierte Version aktualisieren lässt, ohne Daten zu verlieren.
name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Android-Plattform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Debug-Schlüssel
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk mein-training.apk

      - name: Release „latest“ ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mein-training.apk \
            --target "$GITHUB_SHA" \
            --title "Mein Training (neueste Version)" \
            --notes "Stand: $(git log -1 --format='%cd · %s' --date=format:'%d.%m.%Y %H:%M')"
